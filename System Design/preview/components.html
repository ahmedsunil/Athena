<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Components Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-50 text-zinc-950 antialiased">
    <main class="mx-auto max-w-6xl space-y-6 px-4 py-5 sm:px-6">
        <div>
            <h1 class="text-base font-semibold">Components</h1>
            <p class="mt-1 text-xs text-zinc-500">Standalone component previews.</p>
        </div>

        <div class="grid gap-4 lg:grid-cols-2">
            <section class="rounded-xl border border-zinc-200 bg-white p-5 shadow-sm">
                <h2 class="mb-4 text-sm font-semibold">Searchable Dropdown</h2>
                <button class="flex w-full items-center justify-between rounded-lg border border-zinc-300 bg-white px-2.5 py-1.5 text-left text-sm">Select customer <span class="text-zinc-400">⌄</span></button>
                <div class="mt-1 overflow-hidden rounded-lg border border-zinc-200 bg-white shadow-lg">
                    <div class="p-2"><input placeholder="Search" class="w-full rounded-md border border-zinc-200 px-2.5 py-1.5 text-sm"></div>
                    <button class="flex w-full justify-between px-3 py-2 text-left text-sm hover:bg-zinc-100">Aisha Hassan <span>✓</span></button>
                    <button class="flex w-full px-3 py-2 text-left text-sm hover:bg-zinc-100">Ibrahim Ali</button>
                    <button class="flex w-full px-3 py-2 text-left text-sm hover:bg-zinc-100">Mariyam Rasheed</button>
                </div>
            </section>

            <section class="rounded-xl border border-zinc-200 bg-white p-5 shadow-sm">
                <h2 class="mb-4 text-sm font-semibold">Multi Select</h2>
                <button class="flex min-h-9 w-full items-center justify-between rounded-lg border border-zinc-300 px-2.5 py-1.5 text-left text-sm">
                    <span class="flex gap-1.5"><span class="rounded-full bg-zinc-100 px-2 py-0.5 text-xs font-medium">Forms ×</span><span class="rounded-full bg-zinc-100 px-2 py-0.5 text-xs font-medium">Tables ×</span></span>
                    <span class="text-zinc-400">⌄</span>
                </button>
            </section>

            <section class="rounded-xl border border-zinc-200 bg-white p-5 shadow-sm lg:col-span-2">
                <div class="mb-4 flex items-center justify-between">
                    <h2 class="text-sm font-semibold">Repeater</h2>
                    <button class="rounded-lg bg-zinc-950 px-3 py-1.5 text-xs font-semibold text-white">Add row</button>
                </div>
                <div class="space-y-2">
                    <div class="grid gap-2 rounded-lg border border-zinc-200 bg-zinc-50 p-3 sm:grid-cols-[1fr_120px_auto]"><input value="Complete blood count" class="rounded-lg border border-zinc-300 bg-white px-3 py-2 text-sm"><input value="1" class="rounded-lg border border-zinc-300 bg-white px-3 py-2 text-sm"><button class="rounded-lg px-3 text-zinc-400 hover:bg-red-50 hover:text-red-600">Delete</button></div>
                    <div class="grid gap-2 rounded-lg border border-zinc-200 bg-zinc-50 p-3 sm:grid-cols-[1fr_120px_auto]"><input value="Blood glucose" class="rounded-lg border border-zinc-300 bg-white px-3 py-2 text-sm"><input value="2" class="rounded-lg border border-zinc-300 bg-white px-3 py-2 text-sm"><button class="rounded-lg px-3 text-zinc-400 hover:bg-red-50 hover:text-red-600">Delete</button></div>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
