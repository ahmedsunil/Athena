<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Settings Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-50 text-zinc-950 antialiased">
    <main class="mx-auto max-w-5xl space-y-6 px-4 py-5 sm:px-6">
        <div>
            <h1 class="text-base font-semibold">Settings</h1>
            <p class="mt-1 text-xs text-zinc-500">Manage your profile and account settings.</p>
        </div>

        <div class="grid gap-6 lg:grid-cols-[220px_1fr]">
            <aside class="space-y-1">
                <p class="mb-2 px-3 text-[10px] font-semibold uppercase tracking-widest text-zinc-400">Profile Settings</p>
                <button class="w-full rounded-lg bg-zinc-100 px-3 py-2 text-left text-sm font-medium">Profile</button>
                <button class="w-full rounded-lg px-3 py-2 text-left text-sm font-medium text-zinc-600 hover:bg-zinc-100">Password</button>
                <button class="w-full rounded-lg px-3 py-2 text-left text-sm font-medium text-zinc-600 hover:bg-zinc-100">Two-Factor Auth</button>
                <button class="w-full rounded-lg px-3 py-2 text-left text-sm font-medium text-zinc-600 hover:bg-zinc-100">Appearance</button>
            </aside>

            <div class="space-y-4">
                <section class="rounded-xl border border-zinc-200 bg-white p-5 shadow-sm">
                    <div class="mb-5">
                        <h2 class="text-sm font-semibold">Profile Information</h2>
                        <p class="mt-1 text-xs text-zinc-500">Update your name and email address.</p>
                    </div>
                    <div class="space-y-4">
                        <label class="block"><span class="mb-1.5 block text-xs font-medium text-zinc-700">Name</span><input value="Lab Technician" class="w-full rounded-lg border border-zinc-300 px-3 py-2 text-sm"></label>
                        <label class="block"><span class="mb-1.5 block text-xs font-medium text-zinc-700">Email</span><input value="labtech@helix.test" class="w-full rounded-lg border border-zinc-300 px-3 py-2 text-sm"></label>
                        <button class="rounded-lg bg-zinc-950 px-4 py-2 text-xs font-semibold text-white">Save</button>
                    </div>
                </section>

                <section class="rounded-xl border border-red-200 bg-white p-5 shadow-sm">
                    <h2 class="text-sm font-semibold text-red-700">Delete account</h2>
                    <p class="mt-1 text-xs text-zinc-500">Delete your account and all of its resources.</p>
                    <button class="mt-5 rounded-lg bg-red-600 px-4 py-2 text-xs font-semibold text-white">Delete account</button>
                </section>
            </div>
        </div>
    </main>
</body>
</html>
