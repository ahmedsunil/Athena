<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sidebar Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-50 text-zinc-950 antialiased">
    <div class="flex min-h-screen">
        <aside class="fixed inset-y-0 left-0 flex w-64 flex-col border-r border-zinc-200 bg-white">
            <div class="flex h-full min-h-0 flex-col">
                <div class="flex items-center gap-3 px-4 py-5">
                    <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-zinc-950 text-sm font-bold text-white">UI</div>
                    <div class="min-w-0">
                        <p class="truncate text-base font-bold">Admin System</p>
                        <p class="truncate text-xs text-zinc-400">Admin system</p>
                    </div>
                </div>

                <nav class="min-h-0 flex-1 space-y-6 overflow-y-auto px-4 pb-5">
                    <div>
                        <p class="mb-2 px-3 text-[10px] font-semibold uppercase tracking-widest text-zinc-400">Overview</p>
                        <a class="flex items-center gap-2.5 rounded-lg bg-zinc-100 px-3 py-2 text-sm font-medium text-zinc-950" href="#">Dashboard</a>
                    </div>
                    <div>
                        <p class="mb-2 px-3 text-[10px] font-semibold uppercase tracking-widest text-zinc-400">Components</p>
                        <a class="flex items-center gap-2.5 rounded-lg px-3 py-2 text-sm font-medium text-zinc-600 hover:bg-zinc-100 hover:text-zinc-950" href="#">Users</a>
                    </div>
                </nav>

                <div class="mt-auto shrink-0 border-t border-zinc-100 bg-white px-4 pb-4 pt-3">
                    <div id="account-menu" class="hidden overflow-hidden rounded-xl border border-zinc-200 bg-white shadow-sm">
                        <div class="flex items-center gap-3 px-3 py-3">
                            <div class="flex h-11 w-11 items-center justify-center rounded-lg border border-zinc-200 bg-zinc-100 text-sm font-semibold">A</div>
                            <div class="min-w-0">
                                <p class="truncate text-sm font-semibold">Admin</p>
                                <p class="truncate text-xs text-zinc-500">admin@example.com</p>
                            </div>
                        </div>
                        <div class="border-t border-zinc-200 px-3 py-2">
                            <a href="#" class="block rounded-lg px-1 py-2 text-sm font-semibold hover:bg-zinc-50">Settings</a>
                            <button class="block w-full rounded-lg px-1 py-2 text-left text-sm font-semibold hover:bg-zinc-50">Log Out</button>
                        </div>
                    </div>
                    <button id="account-toggle" type="button" class="mt-3 flex w-full items-center justify-between rounded-lg px-2 py-2 text-left hover:bg-zinc-100">
                        <span class="flex min-w-0 items-center gap-2.5">
                            <span class="flex h-9 w-9 items-center justify-center rounded-lg border border-zinc-200 bg-zinc-100 text-xs font-semibold">A</span>
                            <span class="truncate text-sm font-semibold text-zinc-500">Admin</span>
                        </span>
                        <span class="text-zinc-400">↕</span>
                    </button>
                </div>
            </div>
        </aside>
        <main class="ml-64 flex-1 p-6">
            <div class="rounded-xl border border-zinc-200 bg-white p-6 shadow-sm">
                <h1 class="text-base font-semibold">Fixed Sidebar Preview</h1>
                <p class="mt-1 text-sm text-zinc-500">The account menu stays pinned to the bottom.</p>
            </div>
        </main>
    </div>
    <script>
        document.querySelector('#account-toggle').addEventListener('click', () => {
            document.querySelector('#account-menu').classList.toggle('hidden');
        });
    </script>
</body>
</html>
