<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Services — Hulhudhuffaaru School</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['DM Sans','system-ui','sans-serif'], mono: ['IBM Plex Mono','ui-monospace','monospace'] } } } }</script>
</head>
<body class="font-sans bg-slate-50 text-slate-900">
<nav id="nav"></nav>
<main id="main"><div class="flex items-center justify-center min-h-[60vh]"><div class="w-8 h-8 border-2 border-rose-600 border-t-transparent rounded-full animate-spin"></div></div></main>
<footer id="footer"></footer>
<script src="app.js"></script>
<script>
let pageData = null;
let allResources = [];
let activeAudience = 'All';
let activeTab = 'services';
let lcTab = 'request';
let lcState = 'idle'; // idle | sending | sent | verifying | done | rateLimited
let lcvState = 'idle'; // idle | verifying | done | rateLimited
let lcRequestPayload = null;
let lcOtpExpiresAt = null;
let lcCountdownTimer = null;
let lcError = '';
let lcvError = '';
let lcCertificateFile = null;
let lcvCertificateFile = null;
let lcvExpiresAt = null;
const iconColorMap = { sky:'bg-sky-100 text-sky-600', rose:'bg-rose-100 text-rose-600', emerald:'bg-emerald-100 text-emerald-600', amber:'bg-amber-100 text-amber-600', violet:'bg-violet-100 text-violet-600', slate:'bg-slate-100 text-slate-600' };
const calTypeMap = { term:'bg-rose-100 text-rose-700', holiday:'bg-emerald-100 text-emerald-700', exam:'bg-amber-100 text-amber-700', event:'bg-sky-100 text-sky-700' };
const certificateApiBase = 'http://athena.test/api/leaving-certificates';

document.addEventListener('DOMContentLoaded', async () => {
  App.init('digital-services');
  try {
    pageData = await App.fetch('digital-services');
    allResources = pageData.resources;
    renderPage(pageData);
  } catch(e) { App.showError(); }
});

function renderPage(d) {
  document.getElementById('main').innerHTML = `
    <!-- Header -->
    <div class="bg-white border-b border-slate-200 py-10">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <p class="text-xs font-bold uppercase tracking-widest text-rose-600 mb-2">Online Hub</p>
        <h1 class="text-3xl sm:text-4xl font-black text-slate-900">Digital Services</h1>
      </div>
    </div>

    <!-- Tabs -->
    <div class="bg-white border-b border-slate-200 sticky top-0 z-20">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex gap-0 overflow-x-auto">
          ${[['services','Services'],['resources','Resources'],['calendar','Academic Calendar']].map(([id,label])=>`
            <button data-tab="${id}" onclick="switchTab('${id}')"
              class="tab-btn flex-shrink-0 px-5 py-4 text-sm font-semibold border-b-2 transition-colors whitespace-nowrap
              ${id===activeTab?'border-rose-600 text-rose-600':'border-transparent text-slate-500 hover:text-slate-800 hover:border-slate-300'}">
              ${label}
            </button>`).join('')}
        </div>
      </div>
    </div>

    <!-- Tab Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10" id="tab-content">
      ${renderTabContent()}
    </div>`;
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(btn => {
    const active = btn.dataset.tab === tab;
    btn.className = `tab-btn flex-shrink-0 px-5 py-4 text-sm font-semibold border-b-2 transition-colors whitespace-nowrap ${active?'border-rose-600 text-rose-600':'border-transparent text-slate-500 hover:text-slate-800 hover:border-slate-300'}`;
  });
  document.getElementById('tab-content').innerHTML = renderTabContent();
  if (tab === 'resources') renderResources();
}

function renderTabContent() {
  if (activeTab === 'services') return renderServicesTab();
  if (activeTab === 'resources') return renderResourcesTab();
  if (activeTab === 'calendar') return renderCalendarTab(pageData);
  return '';
}

/* ── SERVICES TAB ── */
function renderServicesTab() {
  return `
    <div class="max-w-5xl" id="services-panel">
      <p class="text-sm text-slate-500 mb-8">Request and access official school documents and certificates.</p>
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start" id="services-cards">
        ${renderLCCard()}
        ${renderLCVerificationCard()}
      </div>
    </div>`;
}

function renderLCCard() {
  return `
    <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm" id="lc-card">
      <div class="px-6 pt-6 pb-4 border-b border-slate-100">
        <div class="flex items-center gap-3 mb-1">
          <div class="w-9 h-9 rounded-xl bg-rose-50 flex items-center justify-center text-rose-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          </div>
          <div>
            <h3 class="font-bold text-slate-900 text-sm">Leaving Certificate</h3>
            <p class="text-xs text-slate-400">Official school leaving document</p>
          </div>
        </div>
      </div>

      <!-- Sub-tabs -->
      <div class="flex border-b border-slate-100">
        <button onclick="switchLCTab('request')"
          class="lc-tab flex-1 py-3 text-sm font-semibold transition-colors ${lcTab==='request'?'bg-slate-50 text-slate-900 border-b-2 border-rose-500':'text-slate-400 hover:text-slate-600'}">
          Request
        </button>
        <button onclick="switchLCTab('download')"
          class="lc-tab flex-1 py-3 text-sm font-semibold transition-colors ${lcTab==='download'?'bg-slate-50 text-slate-900 border-b-2 border-rose-500':'text-slate-400 hover:text-slate-600'}">
          Access
        </button>
      </div>

      <!-- Tab body -->
      <div class="p-6" id="lc-body">
        ${lcTab === 'request' ? renderLCRequest() : renderLCDownload()}
      </div>
    </div>`;
}

function renderLCRequest() {
  if (lcState === 'sending') return `
    <div class="flex flex-col items-center py-8 gap-3">
      <div class="w-8 h-8 border-2 border-rose-600 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-sm text-slate-500">Sending verification code…</p>
    </div>`;

  if (lcState === 'sent') return `
    <div class="flex flex-col items-center py-6 gap-3 text-center">
      <div class="w-12 h-12 rounded-full bg-emerald-100 flex items-center justify-center">
        <svg class="w-6 h-6 text-emerald-600" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
      </div>
      <p class="font-semibold text-slate-900 text-sm">Code sent!</p>
      <p class="text-xs text-slate-500 max-w-xs">A verification code has been sent to the registered parent phone number. Switch to the <strong>Access</strong> tab to enter your code.</p>
      <button onclick="switchLCTab('download')" class="mt-2 px-5 py-2 bg-rose-600 hover:bg-rose-700 text-white text-sm font-semibold rounded-xl transition-colors">Go to Access →</button>
    </div>`;

  return `
    <div class="space-y-4">
      ${lcError ? renderInlineMessage(lcError, lcState === 'rateLimited' ? 'warning' : 'error') : ''}
      <p class="text-xs text-slate-500 leading-relaxed">Enter the student's index number and the registered parent phone number. A one-time verification code will be sent via SMS.</p>
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Student Index Number</label>
        <input id="lc-index" type="text" placeholder="e.g. 2024-HS-0142" value="${escapeAttr(lcRequestPayload?.studentIndexNumber || '')}"
          class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-transparent transition">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Parent Phone Number</label>
        <input id="lc-phone" type="tel" placeholder="e.g. +960 777 1234" value="${escapeAttr(lcRequestPayload?.parentPhone || '')}"
          class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-transparent transition">
      </div>
      <button onclick="lcRequestCode()" ${lcState === 'rateLimited' ? 'disabled' : ''} class="w-full py-2.5 ${lcState === 'rateLimited'?'bg-slate-300 cursor-not-allowed':'bg-rose-600 hover:bg-rose-700'} text-white text-sm font-bold rounded-xl transition-colors mt-2">Send Verification Code</button>
    </div>`;
}

function renderLCDownload() {
  if (lcState === 'verifying') return `
    <div class="flex flex-col items-center py-8 gap-3">
      <div class="w-8 h-8 border-2 border-rose-600 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-sm text-slate-500">Verifying code…</p>
    </div>`;

  if (lcState === 'done') return `
    <div class="flex flex-col items-center py-6 gap-3 text-center">
      <div class="w-12 h-12 rounded-full bg-emerald-100 flex items-center justify-center">
        <svg class="w-6 h-6 text-emerald-600" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
      </div>
      <p class="font-semibold text-slate-900 text-sm">Certificate file ready</p>
      <p class="text-xs text-slate-500">Use the link below to open the leaving certificate file.</p>
      ${renderCertificateLink(lcCertificateFile)}
      <button onclick="lcReset()" class="mt-2 text-xs text-slate-400 hover:text-slate-600 underline transition-colors">Start a new request</button>
    </div>`;

  return `
    <div class="space-y-4">
      ${lcError ? renderInlineMessage(lcError, lcState === 'rateLimited' ? 'warning' : 'error') : ''}
      <p class="text-xs text-slate-500 leading-relaxed">Enter the 6-digit verification code sent to the parent's phone number. Then press <strong>Process</strong> to get the certificate file link.</p>
      ${lcOtpExpiresAt ? `<p class="text-xs font-semibold text-rose-600">Code expires in <span id="lc-countdown">${formatCountdown()}</span></p>` : ''}
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Verification Code</label>
        <input id="lc-code" type="text" maxlength="6" placeholder="6-digit code"
          class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-transparent transition font-mono tracking-widest text-center text-lg">
      </div>
      <button onclick="lcProcessDownload()" ${lcState === 'rateLimited' ? 'disabled' : ''} class="w-full py-2.5 ${lcState === 'rateLimited'?'bg-slate-300 cursor-not-allowed':'bg-slate-900 hover:bg-slate-800'} text-white text-sm font-bold rounded-xl transition-colors flex items-center justify-center gap-2 mt-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        Process
      </button>
      <p class="text-center text-xs text-slate-400">Didn't receive a code? <button onclick="lcReset()" class="text-rose-600 hover:underline font-medium">Request again</button></p>
    </div>`;
}

function switchLCTab(tab) {
  lcTab = tab;
  lcState = tab === 'download' && lcOtpExpiresAt ? 'sent' : 'idle';
  lcError = '';
  const card = document.getElementById('lc-card');
  if (card) card.outerHTML = renderLCCard();
  startLCCountdown();
}

async function lcRequestCode() {
  const idx = document.getElementById('lc-index')?.value.trim();
  const phone = document.getElementById('lc-phone')?.value.trim();
  if (!idx || !phone) {
    alert('Please fill in both fields.');
    return;
  }
  lcRequestPayload = { studentIndexNumber: idx, parentPhone: phone };
  lcError = '';
  lcState = 'sending';
  document.getElementById('lc-body').innerHTML = renderLCRequest();
  try {
    const data = await postJson(`${certificateApiBase}/request-code`, lcRequestPayload);
    lcOtpExpiresAt = Date.now() + ((Number(data.expiresInSeconds) || 600) * 1000);
    lcState = 'sent';
    lcTab = 'download';
    const card = document.getElementById('lc-card');
    if (card) card.outerHTML = renderLCCard();
    startLCCountdown();
  } catch (err) {
    lcState = err.status === 429 ? 'rateLimited' : 'idle';
    lcError = err.status === 422 ? 'Student index number or phone number is invalid.' : normalizeCertificateError(err);
    const card = document.getElementById('lc-card');
    if (card) card.outerHTML = renderLCCard();
    if (err.status === 429) releaseRateLimit(() => {
      if (lcState === 'rateLimited') {
        lcState = 'idle';
        const freshCard = document.getElementById('lc-card');
        if (freshCard) freshCard.outerHTML = renderLCCard();
      }
    });
  }
}

async function lcProcessDownload() {
  const code = document.getElementById('lc-code')?.value.trim();
  if (!lcRequestPayload?.studentIndexNumber) {
    lcError = 'Please request a verification code first.';
    const card = document.getElementById('lc-card');
    if (card) card.outerHTML = renderLCCard();
    return;
  }
  if (!code || code.length !== 6) {
    alert('Please enter the verification code.');
    return;
  }
  lcError = '';
  lcState = 'verifying';
  document.getElementById('lc-body').innerHTML = renderLCDownload();
  try {
    lcCertificateFile = await fetchCertificateFile(`${certificateApiBase}/download`, {
      studentIndexNumber: lcRequestPayload.studentIndexNumber,
      code,
    });
    lcState = 'done';
    document.getElementById('lc-body').innerHTML = renderLCDownload();
  } catch (err) {
    lcState = err.status === 429 ? 'rateLimited' : 'sent';
    lcError = err.status === 422 ? 'Invalid or expired verification code.' : normalizeCertificateError(err);
    const card = document.getElementById('lc-card');
    if (card) card.outerHTML = renderLCCard();
    startLCCountdown();
    if (err.status === 429) releaseRateLimit(() => {
      if (lcState === 'rateLimited') {
        lcState = 'sent';
        const freshCard = document.getElementById('lc-card');
        if (freshCard) freshCard.outerHTML = renderLCCard();
        startLCCountdown();
      }
    });
  }
}

function lcReset() {
  lcState = 'idle';
  lcTab = 'request';
  lcError = '';
  lcCertificateFile = null;
  lcOtpExpiresAt = null;
  stopLCCountdown();
  const card = document.getElementById('lc-card');
  if (card) card.outerHTML = renderLCCard();
}

function renderLCVerificationCard() {
  return `
    <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm" id="lc-verification-card">
      <div class="px-6 pt-6 pb-4 border-b border-slate-100">
        <div class="flex items-center gap-3 mb-1">
          <div class="w-9 h-9 rounded-xl bg-sky-50 flex items-center justify-center text-sky-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          </div>
          <div>
            <h3 class="font-bold text-slate-900 text-sm">Leaving Certificate Verification</h3>
            <p class="text-xs text-slate-400">Open with printed certificate code</p>
          </div>
        </div>
      </div>

      <div class="p-6" id="lc-verification-body">
        ${renderLCVerificationBody()}
      </div>
    </div>`;
}

function renderLCVerificationBody() {
  if (lcvState === 'verifying') return `
    <div class="flex flex-col items-center py-8 gap-3">
      <div class="w-8 h-8 border-2 border-sky-600 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-sm text-slate-500">Verifying certificate code...</p>
    </div>`;

  if (lcvState === 'done') return `
    <div class="flex flex-col items-center py-6 gap-3 text-center">
      <div class="w-12 h-12 rounded-full bg-emerald-100 flex items-center justify-center">
        <svg class="w-6 h-6 text-emerald-600" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
      </div>
      <p class="font-semibold text-slate-900 text-sm">Certificate verified</p>
      <p class="text-xs text-slate-500">Use the link below to open the matching certificate file.</p>
      ${renderCertificateLink(lcvCertificateFile)}
      ${lcvExpiresAt ? `<p class="text-[11px] text-slate-400">This link expires in 5 minutes. Verify again if it expires.</p>` : ''}
      <button onclick="lcVerificationReset()" class="mt-2 text-xs text-slate-400 hover:text-slate-600 underline transition-colors">Verify another certificate</button>
    </div>`;

  return `
    <div class="space-y-4">
      ${lcvError ? renderInlineMessage(lcvError, lcvState === 'rateLimited' ? 'warning' : 'error') : ''}
      <p class="text-xs text-slate-500 leading-relaxed">Enter the verification code printed on the leaving certificate. If the code matches a generated certificate, the file link will be shown.</p>
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Certificate Verification Code</label>
        <input id="lc-verification-code" type="text" maxlength="24" placeholder="e.g. LC-2026-ABCDEFGH12345678"
          class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition font-mono tracking-widest text-center uppercase">
      </div>
      <button onclick="lcVerifyAndDownload()" ${lcvState === 'rateLimited' ? 'disabled' : ''} class="w-full py-2.5 ${lcvState === 'rateLimited'?'bg-slate-300 cursor-not-allowed':'bg-slate-900 hover:bg-slate-800'} text-white text-sm font-bold rounded-xl transition-colors flex items-center justify-center gap-2 mt-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        Verify
      </button>
    </div>`;
}

async function lcVerifyAndDownload() {
  const code = document.getElementById('lc-verification-code')?.value.trim();
  if (!code || code.length < 6) {
    alert('Please enter the certificate verification code.');
    return;
  }
  lcvError = '';
  lcvState = 'verifying';
  document.getElementById('lc-verification-body').innerHTML = renderLCVerificationBody();
  try {
    lcvCertificateFile = await fetchCertificateFile(`${certificateApiBase}/verify`, {
      verificationCode: code,
    });
    lcvExpiresAt = lcvCertificateFile.expiresAt || null;
    lcvState = 'done';
    document.getElementById('lc-verification-body').innerHTML = renderLCVerificationBody();
  } catch (err) {
    lcvState = err.status === 429 ? 'rateLimited' : 'idle';
    lcvError = err.status === 403 ? 'This certificate has been revoked. Please contact the school office.' : normalizeCertificateError(err);
    const card = document.getElementById('lc-verification-card');
    if (card) card.outerHTML = renderLCVerificationCard();
    if (err.status === 429) releaseRateLimit(() => {
      if (lcvState === 'rateLimited') {
        lcvState = 'idle';
        const freshCard = document.getElementById('lc-verification-card');
        if (freshCard) freshCard.outerHTML = renderLCVerificationCard();
      }
    });
  }
}

function lcVerificationReset() {
  lcvState = 'idle';
  lcvError = '';
  lcvCertificateFile = null;
  lcvExpiresAt = null;
  const card = document.getElementById('lc-verification-card');
  if (card) card.outerHTML = renderLCVerificationCard();
}

function certificateHeaders(accept = 'application/json') {
  const headers = {
    'Content-Type': 'application/json',
    'Accept': accept,
  };
  if (window.PUBLIC_API_KEY) headers['X-Public-Api-Key'] = window.PUBLIC_API_KEY;
  return headers;
}

async function postJson(url, payload) {
  const response = await fetch(url, {
    method: 'POST',
    headers: certificateHeaders('application/json'),
    credentials: 'same-origin',
    body: JSON.stringify(payload),
  });
  if (!response.ok) throw await readCertificateError(response);
  return response.json();
}

async function fetchCertificateFile(url, payload) {
  const response = await fetch(url, {
    method: 'POST',
    headers: certificateHeaders('application/json'),
    credentials: 'same-origin',
    body: JSON.stringify(payload),
  });
  if (!response.ok) throw await readCertificateError(response);
  const data = await response.json();
  const fileUrl = data.pdf_url || data.pdfUrl;
  if (!fileUrl) throw { status: 422, message: 'Certificate file link is unavailable. Backend returned no pdf_url.' };
  return {
    url: fileUrl,
    fileName: data.fileName || data.filename || data.file_name || 'leaving-certificate',
    fileType: data.fileType || data.mimeType || data.contentType || data.file_type || '',
    expiresAt: data.expiresInSeconds ? Date.now() + (Number(data.expiresInSeconds) * 1000) : null,
  };
}

async function readCertificateError(response) {
  let message = '';
  try {
    const data = await response.json();
    message = data.message || '';
  } catch(e) {}
  return { status: response.status, message };
}

function normalizeCertificateError(err) {
  if (err.status === 429) return 'Too many requests. Please try again later.';
  if (err.status === 403 && /revoked/i.test(err.message || '')) return 'This certificate has been revoked. Please contact the school office.';
  if (err.status === 403) return err.message || 'Certificate is not available.';
  if (err.status === 404) return err.message || 'Certificate verification code was not found.';
  if (err.status === 422) return err.message || 'Certificate file unavailable or misconfigured.';
  return err.message || 'Unable to get certificate file link.';
}

function renderCertificateLink(file) {
  if (!file?.url) return '';
  const label = 'View Certificate';
  const type = file.fileType ? `<span class="block text-[10px] uppercase tracking-wide text-slate-400 mt-0.5">${escapeHtml(file.fileType)}</span>` : '';
  return `
    <a href="${escapeAttr(file.url)}" target="_blank" rel="noopener noreferrer" class="mt-2 w-full flex items-center justify-center gap-2 rounded-xl border border-sky-200 bg-sky-50 px-4 py-2.5 text-sm font-semibold text-sky-700 hover:bg-sky-100 transition-colors">
      ${App.icon('ExternalLink')}
      <span class="min-w-0">
        <span class="block truncate">${escapeHtml(label)}</span>
        ${type}
      </span>
    </a>`;
}

function renderInlineMessage(message, tone = 'error') {
  const color = tone === 'warning' ? 'bg-amber-50 border-amber-200 text-amber-800' : 'bg-rose-50 border-rose-200 text-rose-700';
  return `<p class="text-xs leading-relaxed border rounded-xl px-3 py-2 ${color}">${escapeHtml(message)}</p>`;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;',
  }[ch]));
}

function escapeAttr(value) {
  return escapeHtml(value);
}

function formatCountdown() {
  if (!lcOtpExpiresAt) return '10:00';
  const remaining = Math.max(0, Math.ceil((lcOtpExpiresAt - Date.now()) / 1000));
  const minutes = Math.floor(remaining / 60);
  const seconds = String(remaining % 60).padStart(2, '0');
  return `${minutes}:${seconds}`;
}

function startLCCountdown() {
  stopLCCountdown();
  if (!lcOtpExpiresAt || lcTab !== 'download') return;
  const update = () => {
    const el = document.getElementById('lc-countdown');
    if (el) el.textContent = formatCountdown();
    if (Date.now() >= lcOtpExpiresAt) stopLCCountdown();
  };
  update();
  lcCountdownTimer = window.setInterval(update, 1000);
}

function stopLCCountdown() {
  if (lcCountdownTimer) {
    window.clearInterval(lcCountdownTimer);
    lcCountdownTimer = null;
  }
}

function releaseRateLimit(callback) {
  window.setTimeout(callback, 3000);
}

/* ── RESOURCES TAB ── */
function renderResourcesTab() {
  return `
    <div>
      <div class="flex flex-wrap gap-2 mb-6" id="aud-filters">
        ${['All','Students','Parents','Staff'].map(a=>`
          <button data-aud="${a}" onclick="filterResources('${a}')"
            class="aud-btn px-4 py-2 rounded-full text-sm font-semibold border transition-colors ${a===activeAudience?'bg-rose-600 border-rose-600 text-white':'bg-white border-slate-200 text-slate-600 hover:border-slate-300'}">
            ${a}
          </button>`).join('')}
      </div>
      <div id="resources-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </div>`;
}

function filterResources(aud) {
  activeAudience = aud;
  document.querySelectorAll('.aud-btn').forEach(btn => {
    const isActive = btn.dataset.aud === aud;
    btn.className = `aud-btn px-4 py-2 rounded-full text-sm font-semibold border transition-colors ${isActive?'bg-rose-600 border-rose-600 text-white':'bg-white border-slate-200 text-slate-600 hover:border-slate-300'}`;
  });
  renderResources();
}

function renderResources() {
  const filtered = activeAudience === 'All' ? allResources : allResources.filter(r => r.audience === activeAudience || r.audience === 'All');
  document.getElementById('resources-grid').innerHTML = filtered.map(r => `
    <a href="${r.url}" target="_blank" rel="noopener" class="group bg-white rounded-2xl border border-slate-200 p-5 hover:shadow-md hover:border-rose-200 transition-all block">
      <div class="flex items-start gap-3 mb-3">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 ${iconColorMap[r.iconColor]||'bg-slate-100 text-slate-600'}">${App.icon(r.icon)}</div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-1.5">
            <p class="font-bold text-slate-900 text-sm">${r.title}</p>
            <span class="text-slate-400 group-hover:text-rose-500 transition-colors">${App.icon('ExternalLink')}</span>
          </div>
          <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">${r.audience}</span>
        </div>
      </div>
      <p class="text-xs text-slate-600 leading-relaxed">${r.description}</p>
    </a>`).join('');
}

/* ── CALENDAR TAB ── */
function renderCalendarTab(d) {
  const typeMap = { term:'bg-rose-100 text-rose-700', holiday:'bg-emerald-100 text-emerald-700', exam:'bg-amber-100 text-amber-700', event:'bg-sky-100 text-sky-700' };
  return `
    <div class="max-w-2xl space-y-3">
      ${d.calendarEntries.map(e=>`
        <div class="bg-white rounded-xl border border-slate-200 p-4 flex items-start gap-4">
          <div class="flex-shrink-0 text-center w-10 pt-0.5">
            <p class="text-xl font-black text-rose-600 leading-none">${new Date(e.date).getDate()}</p>
            <p class="text-[10px] text-slate-400 uppercase font-semibold">${new Date(e.date).toLocaleString('en',{month:'short'})}</p>
            <p class="text-[10px] text-slate-300 font-semibold">${new Date(e.date).getFullYear()}</p>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap mb-1">
              <p class="text-sm font-semibold text-slate-900">${e.title}</p>
              <span class="text-[9px] font-bold uppercase tracking-wide px-1.5 py-0.5 rounded ${typeMap[e.type]||'bg-slate-100 text-slate-600'}">${e.type}</span>
            </div>
            ${e.endDate ? `<p class="text-xs text-slate-400 mb-0.5">Until ${App.formatShortDate(e.endDate)}</p>` : ''}
            <p class="text-xs text-slate-500 leading-relaxed">${e.description}</p>
          </div>
        </div>`).join('')}
    </div>`;
}
</script>
