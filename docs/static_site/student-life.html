<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Life — Hulhudhuffaaru School</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['DM Sans','system-ui','sans-serif'], mono: ['IBM Plex Mono','ui-monospace','monospace'] } } } }</script>
</head>
<body class="font-sans bg-slate-50 text-slate-900">
<nav id="nav"></nav>
<main id="main"><div class="flex items-center justify-center min-h-[60vh]"><div class="w-8 h-8 border-2 border-rose-600 border-t-transparent rounded-full animate-spin"></div></div></main>
<footer id="footer"></footer>
<script src="app.js"></script>
<script>
let activeTab = 'clubs';
let pageData = null;
const houseColors = { rose:'bg-rose-500', sky:'bg-sky-500', emerald:'bg-emerald-500', amber:'bg-amber-500' };
const houseTextColors = { rose:'text-rose-600', sky:'text-sky-600', emerald:'text-emerald-600', amber:'text-amber-600' };
const houseBgLight = { rose:'bg-rose-50', sky:'bg-sky-50', emerald:'bg-emerald-50', amber:'bg-amber-50' };
const clubLogos = {
  'club-sci-tech':    { bg:'bg-violet-100', fg:'text-violet-600', path:'M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15.3M14.25 3.104c.251.023.501.05.75.082M19.8 15.3l-1.57.393A9.065 9.065 0 0112 15a9.065 9.065 0 00-6.23-.693L5 14.5m14.8.8 1.402 1.402c1.232 1.232.65 3.318-1.067 3.611A48.309 48.309 0 0112 21c-2.773 0-5.491-.235-8.135-.687-1.718-.293-2.3-2.379-1.067-3.61L5 14.5' },
  'club-drama':       { bg:'bg-pink-100', fg:'text-pink-600', path:'M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09ZM18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456ZM16.894 20.567 16.5 21.75l-.394-1.183a2.25 2.25 0 00-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 001.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 001.423 1.423l1.183.394-1.183.394a2.25 2.25 0 00-1.423 1.423Z' },
  'club-debate':      { bg:'bg-sky-100', fg:'text-sky-600', path:'M20.25 8.511c.884.284 1.5 1.128 1.5 2.097v4.286c0 1.136-.847 2.1-1.98 2.193-.34.027-.68.052-1.02.072v3.091l-3-3c-1.354 0-2.694-.055-4.02-.163a2.115 2.115 0 01-.825-.242m9.345-8.334a2.126 2.126 0 00-.476-.095 48.64 48.64 0 00-8.048 0c-1.131.094-1.976 1.057-1.976 2.192v4.286c0 .837.46 1.58 1.155 1.951m9.345-8.334V6.637c0-1.621-1.152-3.026-2.76-3.235A48.455 48.455 0 0011.25 3c-2.115 0-4.198.137-6.24.402-1.608.209-2.76 1.614-2.76 3.235v6.226c0 1.621 1.152 3.026 2.76 3.235.577.075 1.157.14 1.74.194V21l4.155-4.155' },
  'club-math':        { bg:'bg-amber-100', fg:'text-amber-600', path:'M15.75 15.75V18m-7.5-6.75h.008v.008H8.25v-.008Zm0 2.25h.008v.008H8.25V13.5Zm0 2.25h.008v.008H8.25v-.008Zm0 2.25h.008v.008H8.25V18Zm2.498-6.75h.007v.008h-.007v-.008Zm0 2.25h.007v.008h-.007V13.5Zm0 2.25h.007v.008h-.007v-.008Zm0 2.25h.007v.008h-.007V18Zm2.504-6.75h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V13.5Zm0 2.25h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V18Zm2.498-6.75h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V13.5ZM8.25 6h7.5v2.25h-7.5V6ZM12 2.25c-1.892 0-3.758.11-5.593.322C5.307 2.7 4.5 3.548 4.5 4.564v13.372c0 1.016.807 1.864 1.907 1.992C7.75 20.078 9.875 20.25 12 20.25c2.125 0 4.25-.172 6.093-.322 1.1-.128 1.907-.976 1.907-1.992V4.564c0-1.016-.807-1.864-1.907-1.992A48.507 48.507 0 0012 2.25Z' },
  'club-green-earth': { bg:'bg-emerald-100', fg:'text-emerald-600', path:'M12.75 3.03v.568c0 .334.148.65.405.864l1.068.89c.442.369.535 1.01.216 1.49l-.51.766a2.25 2.25 0 01-1.161.886l-.143.048a1.107 1.107 0 00-.57 1.664c.369.555.169 1.307-.427 1.605L9 13.125l.423 1.059a.956.956 0 01-1.652.928l-.679-.906a1.125 1.125 0 00-1.906.172L4.5 15.75l-.612.153M12.75 3.031a9 9 0 00-8.862 12.872M12.75 3.031a9 9 0 016.69 14.036m0 0-.177-.529A2.249 2.249 0 0017.128 15H16.5l-.324-.324a1.453 1.453 0 00-2.328.377l-.036.073a1.586 1.586 0 01-.982.816l-.99.282c-.55.157-.894.702-.8 1.267l.073.438c.08.474.49.821.97.821.846 0 1.598.542 1.865 1.345l.215.643m5.276-3.67a9.012 9.012 0 01-5.276 3.67m0 0a9 9 0 01-10.275-4.835M15.75 9c0 .896-.393 1.7-1.016 2.25' },
  'club-french':      { bg:'bg-blue-100', fg:'text-blue-600', path:'M10.5 21l5.25-11.25L21 21m-9-3h7.5M3 5.621a48.474 48.474 0 016-.371m0 0c1.12 0 2.233.038 3.334.114M9 5.25V3m3.334 2.364C11.176 10.658 7.69 15.08 3 17.502m9.334-12.138c.896.061 1.785.147 2.666.257m-4.589 8.495a18.023 18.023 0 01-3.827-5.802' },
};

document.addEventListener('DOMContentLoaded', async () => {
  App.init('student-life');
  try {
    pageData = await App.fetch('student-life');
    renderPage();
  } catch(e) { App.showError(); }
});

function renderPage() {
  document.getElementById('main').innerHTML = `
    <div class="bg-white border-b border-slate-200 py-10">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <p class="text-xs font-bold uppercase tracking-widest text-rose-600 mb-2">Beyond the Classroom</p>
        <h1 class="text-3xl sm:text-4xl font-black text-slate-900">Student Life</h1>
      </div>
    </div>
    <div class="bg-white border-b border-slate-200 sticky top-16 z-40">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex gap-0 overflow-x-auto">
          ${['clubs','prefects','houses','scouts'].map(t=>`
            <button data-tab="${t}" onclick="switchTab('${t}')" class="tab-btn px-5 py-4 text-sm font-semibold whitespace-nowrap border-b-2 transition-colors ${t===activeTab?'border-rose-600 text-rose-600':'border-transparent text-slate-500 hover:text-slate-700'}">
              ${t.charAt(0).toUpperCase()+t.slice(1)}
            </button>`).join('')}
        </div>
      </div>
    </div>
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10" id="tab-content"></div>`;
  renderTab();
}

function switchTab(t) {
  activeTab = t;
  document.querySelectorAll('.tab-btn').forEach(btn => {
    const isActive = btn.dataset.tab === t;
    btn.className = `tab-btn px-5 py-4 text-sm font-semibold whitespace-nowrap border-b-2 transition-colors ${isActive?'border-rose-600 text-rose-600':'border-transparent text-slate-500 hover:text-slate-700'}`;
  });
  renderTab();
}

function renderTab() {
  const el = document.getElementById('tab-content');
  if (activeTab === 'clubs') {
    el.innerHTML = `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      ${pageData.clubs.map(c=>`
        <div class="bg-white rounded-2xl border border-slate-200 p-6 hover:shadow-md transition-shadow">
          <div class="w-20 h-20 rounded-2xl flex items-center justify-center mb-5 bg-white shadow-sm ring-1 ring-inset ring-slate-200 overflow-hidden">
            ${(c.logoUrl||c.logoPath)
              ? `<img src="${c.logoUrl||c.logoPath}" alt="${c.name} logo" class="w-full h-full object-contain p-2">`
              : `<div class="w-full h-full flex items-center justify-center ${(clubLogos[c.id]||{bg:'bg-slate-100',fg:'text-slate-400'}).bg} ${(clubLogos[c.id]||{bg:'bg-slate-100',fg:'text-slate-400'}).fg}"><svg xmlns="http://www.w3.org/2000/svg" class="w-9 h-9" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="${(clubLogos[c.id]||{path:''}).path}"/></svg></div>`}
          </div>
          <h3 class="font-bold text-slate-900 mb-2">${c.name}</h3>
          <p class="text-xs text-sky-600 font-semibold mb-3 flex items-center gap-1">${App.icon('Calendar')} ${c.meetingSchedule}</p>
          <p class="text-sm text-slate-600 leading-relaxed mb-4">${c.description}</p>
          <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
            <div><p class="text-xs text-slate-400">Teacher incharge</p><p class="text-xs font-semibold text-slate-700">${(c.teacherIncharge||c.patron).name}</p></div>
            <div class="text-right"><p class="text-xs text-slate-400">President</p><p class="text-xs font-semibold text-slate-700">${c.president.name} · ${c.president.className}</p></div>
          </div>
        </div>`).join('')}
    </div>`;
  } else if (activeTab === 'prefects') {
    el.innerHTML = `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      ${pageData.prefects.map(p=>`
        <div class="bg-white rounded-2xl border border-slate-200 p-6 text-center">
          <div class="w-16 h-16 bg-rose-100 rounded-full mx-auto mb-3 flex items-center justify-center text-rose-600 font-black text-xl">${p.name.charAt(0)}</div>
          <p class="font-bold text-slate-900 text-sm">${p.name}</p>
          <p class="text-xs text-rose-600 font-semibold uppercase tracking-wide mt-0.5 mb-1">${p.role}</p>
          <p class="text-xs text-slate-400 mb-3">${p.className}</p>
          <p class="text-xs text-slate-500 italic leading-relaxed">"${p.quote}"</p>
        </div>`).join('')}
    </div>`;
  } else if (activeTab === 'houses') {
    el.innerHTML = `<div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
      ${pageData.houses.map(h=>`
        <div class="group relative bg-white rounded-2xl border border-slate-200 overflow-hidden hover:shadow-lg hover:-translate-y-0.5 transition-all">
          <div class="absolute inset-y-0 left-0 w-1.5 ${houseColors[h.colour]||'bg-slate-400'}"></div>
          <div class="absolute -right-10 -top-12 w-36 h-36 rounded-full ${houseBgLight[h.colour]||'bg-slate-50'} opacity-80"></div>
          <svg viewBox="0 0 24 24" class="absolute -right-3 -top-4 w-28 h-28 ${houseTextColors[h.colour]||'text-slate-300'} opacity-10" fill="currentColor"><path d="M12 1 3 5v7c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5L12 1Zm0 4 5 2.18V12c0 3.5-2.33 6.79-5 7.93-2.67-1.14-5-4.43-5-7.93V7.18L12 5Z"/></svg>
          <div class="relative p-6 pl-7">
            <div class="flex items-start gap-4 mb-5">
              <div class="w-16 h-16 flex-shrink-0 flex items-center justify-center rounded-2xl ${houseBgLight[h.colour]||'bg-slate-50'} shadow-sm ring-1 ring-inset ring-white/80">
                <svg viewBox="0 0 24 24" class="w-10 h-10 ${houseTextColors[h.colour]||'text-slate-400'}" fill="currentColor"><path d="M12 1 3 5v7c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5L12 1Zm0 4 5 2.18V12c0 3.5-2.33 6.79-5 7.93-2.67-1.14-5-4.43-5-7.93V7.18L12 5Z"/></svg>
              </div>
              <div class="flex-1 min-w-0">
                <h3 class="font-black text-slate-900 text-lg leading-tight">${h.name}</h3>
                <span class="text-xs font-semibold italic ${houseTextColors[h.colour]||'text-slate-400'}">"${h.motto}"</span>
              </div>
            </div>
            <p class="text-sm text-slate-600 leading-relaxed mb-4">${h.description}</p>
            <div class="flex items-center justify-between pt-4 border-t border-slate-100">
              <div><p class="text-xs text-slate-400">House Master/Mistress</p><p class="text-xs font-semibold text-slate-700">${h.houseMaster.name}</p></div>
              <div class="text-right"><p class="text-xs text-slate-400">Captain</p><p class="text-xs font-semibold text-slate-700">${h.houseCaptain.name} · ${h.houseCaptain.className}</p></div>
            </div>
          </div>
        </div>`).join('')}
    </div>`;
  } else if (activeTab === 'scouts') {
    el.innerHTML = `<div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
      ${pageData.scoutsGroups.map(g=>`
        <div class="bg-white rounded-2xl border border-slate-200 p-6 hover:shadow-md transition-shadow">
          <span class="inline-block text-xs font-bold uppercase tracking-wide bg-amber-100 text-amber-700 px-2.5 py-0.5 rounded-full mb-3">${g.groupType}</span>
          <h3 class="font-bold text-slate-900 mb-2">${g.name}</h3>
          <p class="text-xs text-sky-600 font-semibold mb-3">${App.icon('Calendar')} ${g.meetingSchedule}</p>
          <p class="text-sm text-slate-600 leading-relaxed mb-4">${g.description}</p>
          <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
            <div><p class="text-xs text-slate-400">Leader</p><p class="text-xs font-semibold text-slate-700">${g.leader.name}</p></div>
            <div class="text-right"><p class="text-xs text-slate-400">Assistant Leader</p><p class="text-xs font-semibold text-slate-700">${(g.assistantLeader||g.patron).name}</p></div>
          </div>
        </div>`).join('')}
    </div>`;
  }
}
</script>
</body>
</html>
