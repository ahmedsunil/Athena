<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Life — Hulhudhuffaaru School</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['DM Sans','system-ui','sans-serif'], mono: ['IBM Plex Mono','ui-monospace','monospace'] } } } }</script>
</head>
<body class="font-sans bg-slate-50 text-slate-900">
<nav id="nav"></nav>
<main id="main"><div class="flex items-center justify-center min-h-[60vh]"><div class="w-8 h-8 border-2 border-rose-600 border-t-transparent rounded-full animate-spin"></div></div></main>
<footer id="footer"></footer>
<script src="app.js"></script>
<script>
let activeTab = 'clubs';
let pageData = null;
const houseColors = { rose:'bg-rose-500', sky:'bg-sky-500', emerald:'bg-emerald-500', amber:'bg-amber-500' };

document.addEventListener('DOMContentLoaded', async () => {
  App.init('student-life');
  try {
    pageData = await App.fetch('student-life');
    renderPage();
  } catch(e) { App.showError(); }
});

function renderPage() {
  document.getElementById('main').innerHTML = `
    <div class="bg-white border-b border-slate-200 py-10">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <p class="text-xs font-bold uppercase tracking-widest text-rose-600 mb-2">Beyond the Classroom</p>
        <h1 class="text-3xl sm:text-4xl font-black text-slate-900">Student Life</h1>
      </div>
    </div>
    <div class="bg-white border-b border-slate-200 sticky top-16 z-40">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex gap-0 overflow-x-auto">
          ${['clubs','prefects','houses','scouts'].map(t=>`
            <button data-tab="${t}" onclick="switchTab('${t}')" class="tab-btn px-5 py-4 text-sm font-semibold whitespace-nowrap border-b-2 transition-colors ${t===activeTab?'border-rose-600 text-rose-600':'border-transparent text-slate-500 hover:text-slate-700'}">
              ${t.charAt(0).toUpperCase()+t.slice(1)}
            </button>`).join('')}
        </div>
      </div>
    </div>
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10" id="tab-content"></div>`;
  renderTab();
}

function switchTab(t) {
  activeTab = t;
  document.querySelectorAll('.tab-btn').forEach(btn => {
    const isActive = btn.dataset.tab === t;
    btn.className = `tab-btn px-5 py-4 text-sm font-semibold whitespace-nowrap border-b-2 transition-colors ${isActive?'border-rose-600 text-rose-600':'border-transparent text-slate-500 hover:text-slate-700'}`;
  });
  renderTab();
}

function renderTab() {
  const el = document.getElementById('tab-content');
  if (activeTab === 'clubs') {
    el.innerHTML = `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      ${pageData.clubs.map(c=>`
        <div class="bg-white rounded-2xl border border-slate-200 p-6 hover:shadow-md transition-shadow">
          <h3 class="font-bold text-slate-900 mb-2">${c.name}</h3>
          <p class="text-xs text-sky-600 font-semibold mb-3 flex items-center gap-1">${App.icon('Calendar')} ${c.meetingSchedule}</p>
          <p class="text-sm text-slate-600 leading-relaxed mb-4">${c.description}</p>
          <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
            <div><p class="text-xs text-slate-400">Teacher incharge</p><p class="text-xs font-semibold text-slate-700">${(c.teacherIncharge||c.patron).name}</p></div>
            <div class="text-right"><p class="text-xs text-slate-400">President</p><p class="text-xs font-semibold text-slate-700">${c.president.name} · ${c.president.className}</p></div>
          </div>
        </div>`).join('')}
    </div>`;
  } else if (activeTab === 'prefects') {
    el.innerHTML = `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      ${pageData.prefects.map(p=>`
        <div class="bg-white rounded-2xl border border-slate-200 p-6 text-center">
          <div class="w-16 h-16 bg-rose-100 rounded-full mx-auto mb-3 flex items-center justify-center text-rose-600 font-black text-xl">${p.name.charAt(0)}</div>
          <p class="font-bold text-slate-900 text-sm">${p.name}</p>
          <p class="text-xs text-rose-600 font-semibold uppercase tracking-wide mt-0.5 mb-1">${p.role}</p>
          <p class="text-xs text-slate-400 mb-3">${p.className}</p>
          <p class="text-xs text-slate-500 italic leading-relaxed">"${p.quote}"</p>
        </div>`).join('')}
    </div>`;
  } else if (activeTab === 'houses') {
    el.innerHTML = `<div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
      ${pageData.houses.map(h=>`
        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden hover:shadow-md transition-shadow">
          <div class="h-2 ${houseColors[h.colour]||'bg-slate-400'}"></div>
          <div class="p-6">
            <div class="flex items-start justify-between gap-2 mb-3">
              <h3 class="font-black text-slate-900 text-lg">${h.name}</h3>
              <span class="text-xs font-semibold italic text-slate-500">"${h.motto}"</span>
            </div>
            <p class="text-sm text-slate-600 leading-relaxed mb-4">${h.description}</p>
            <div class="flex items-center justify-between pt-4 border-t border-slate-100">
              <div><p class="text-xs text-slate-400">House Master/Mistress</p><p class="text-xs font-semibold text-slate-700">${h.houseMaster.name}</p></div>
              <div class="text-right"><p class="text-xs text-slate-400">Captain</p><p class="text-xs font-semibold text-slate-700">${h.houseCaptain.name} · ${h.houseCaptain.className}</p></div>
            </div>
          </div>
        </div>`).join('')}
    </div>`;
  } else if (activeTab === 'scouts') {
    el.innerHTML = `<div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
      ${pageData.scoutsGroups.map(g=>`
        <div class="bg-white rounded-2xl border border-slate-200 p-6 hover:shadow-md transition-shadow">
          <span class="inline-block text-xs font-bold uppercase tracking-wide bg-amber-100 text-amber-700 px-2.5 py-0.5 rounded-full mb-3">${g.groupType}</span>
          <h3 class="font-bold text-slate-900 mb-2">${g.name}</h3>
          <p class="text-xs text-sky-600 font-semibold mb-3">${App.icon('Calendar')} ${g.meetingSchedule}</p>
          <p class="text-sm text-slate-600 leading-relaxed mb-4">${g.description}</p>
          <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
            <div><p class="text-xs text-slate-400">Leader</p><p class="text-xs font-semibold text-slate-700">${g.leader.name}</p></div>
            <div class="text-right"><p class="text-xs text-slate-400">Assistant Leader</p><p class="text-xs font-semibold text-slate-700">${(g.assistantLeader||g.patron).name}</p></div>
          </div>
        </div>`).join('')}
    </div>`;
  }
}
</script>
</body>
</html>
