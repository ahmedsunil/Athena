<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academics — Hulhudhuffaaru School</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['DM Sans','system-ui','sans-serif'], mono: ['IBM Plex Mono','ui-monospace','monospace'] } } } }</script>
</head>
<body class="font-sans bg-slate-50 text-slate-900">
<nav id="nav"></nav>
<main id="main"><div class="flex items-center justify-center min-h-[60vh]"><div class="w-8 h-8 border-2 border-rose-600 border-t-transparent rounded-full animate-spin"></div></div></main>
<footer id="footer"></footer>
<script src="app.js"></script>
<script>
const categoryColors = { Languages:'bg-sky-100 text-sky-700', Sciences:'bg-emerald-100 text-emerald-700', Humanities:'bg-amber-100 text-amber-700', Arts:'bg-rose-100 text-rose-700', Technology:'bg-violet-100 text-violet-700' };

document.addEventListener('DOMContentLoaded', async () => {
  App.init('academics');
  try {
    const d = await App.fetch('academics');
    renderPage(d);
  } catch(e) { App.showError(); }
});

function renderPage(d) {
  document.getElementById('main').innerHTML = `
    <div class="bg-white border-b border-slate-200 py-10">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <p class="text-xs font-bold uppercase tracking-widest text-rose-600 mb-2">Our Curriculum</p>
        <h1 class="text-3xl sm:text-4xl font-black text-slate-900 mb-3">Academics</h1>
        <p class="text-slate-500 max-w-2xl text-sm leading-relaxed">${d.overview.text}</p>
        <span class="mt-3 inline-block text-xs font-semibold bg-sky-100 text-sky-700 px-3 py-1 rounded-full">${d.overview.curriculum}</span>
      </div>
    </div>
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-12">
      ${d.levels.map(lv => `
        <div id="${lv.id}">
          <div class="flex flex-col sm:flex-row sm:items-end gap-2 mb-6">
            <div>
              <span class="text-xs font-bold uppercase tracking-widest text-rose-600">${lv.abbreviation}</span>
              <h2 class="text-2xl font-black text-slate-900">${lv.label}</h2>
            </div>
            <div class="flex gap-2 sm:ml-auto">
              <span class="text-xs bg-slate-100 text-slate-600 px-3 py-1 rounded-full">${lv.ageRange}</span>
              <span class="text-xs bg-slate-100 text-slate-600 px-3 py-1 rounded-full">${lv.yearGroups}</span>
            </div>
          </div>
          <p class="text-slate-500 text-sm mb-6 leading-relaxed">${lv.description}</p>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            ${lv.courses.map(c => `
              <div class="bg-white rounded-2xl border border-slate-200 p-5 hover:shadow-md transition-shadow cursor-pointer course-card">
                <div class="flex items-start justify-between gap-2 mb-3">
                  <h3 class="font-bold text-slate-900 text-sm leading-snug">${c.name}</h3>
                  <span class="text-[10px] font-bold uppercase tracking-wide px-2 py-0.5 rounded-full flex-shrink-0 ${categoryColors[c.category]||'bg-slate-100 text-slate-600'}">${c.category}</span>
                </div>
                <div class="flex gap-2 mb-3">
                  <span class="text-[10px] text-slate-400 bg-slate-50 px-2 py-0.5 rounded">${c.duration}</span>
                  <span class="text-[10px] text-slate-400 bg-slate-50 px-2 py-0.5 rounded">${c.yearGroup}</span>
                </div>
                <p class="text-xs text-slate-600 leading-relaxed mb-3">${c.shortDescription}</p>
                <button onclick="toggleCourse(this)" class="text-xs font-semibold text-rose-600 hover:text-rose-700">Read more ${App.icon('ChevronDown')}</button>
                <div class="full-desc hidden mt-3 text-xs text-slate-600 leading-relaxed border-t border-slate-100 pt-3">${c.fullDescription}</div>
              </div>`).join('')}
          </div>
        </div>`).join('')}
    </div>`;
}

function toggleCourse(btn) {
  const desc = btn.nextElementSibling;
  desc.classList.toggle('hidden');
  btn.innerHTML = desc.classList.contains('hidden')
    ? `Read more ${App.icon('ChevronDown')}`
    : `Show less ${App.icon('ChevronDown')}`;
}
</script>
</body>
</html>
