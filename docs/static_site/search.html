<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search — Hulhudhuffaaru School</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['DM Sans','system-ui','sans-serif'], mono: ['IBM Plex Mono','ui-monospace','monospace'] } } } }</script>
</head>
<body class="font-sans bg-slate-50 text-slate-900">
<nav id="nav"></nav>
<main id="main"><div class="flex items-center justify-center min-h-[60vh]"><div class="w-8 h-8 border-2 border-rose-600 border-t-transparent rounded-full animate-spin"></div></div></main>
<footer id="footer"></footer>
<script src="app.js"></script>
<script>
let allResults = [];
let suggestions = [];
const sectionColors = { Events:'bg-sky-100 text-sky-700', Academics:'bg-emerald-100 text-emerald-700', Downloads:'bg-amber-100 text-amber-700', News:'bg-rose-100 text-rose-700' };

document.addEventListener('DOMContentLoaded', async () => {
  App.init('search');
  try {
    const d = await App.fetch('search');
    allResults = d.sampleResults;
    suggestions = d.emptyStateSuggestions;
    renderPage(d.sampleQuery);
  } catch(e) { App.showError(); }
});

function renderPage(sampleQuery) {
  document.getElementById('main').innerHTML = `
    <div class="bg-white border-b border-slate-200 py-10">
      <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
        <p class="text-xs font-bold uppercase tracking-widest text-rose-600 mb-3">Portal Search</p>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">${App.icon('Search')}</span>
          <input type="text" id="search-input" placeholder="Search events, courses, documents, news…"
            value="${sampleQuery}"
            class="w-full pl-12 pr-4 py-4 rounded-2xl border border-slate-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-rose-500 text-base bg-white"
            oninput="handleSearch(this.value)">
        </div>
        <p class="text-xs text-slate-400 mt-2">Tip: try "science", "admissions", "timetable"</p>
      </div>
    </div>
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8" id="results-container"></div>`;
  handleSearch(sampleQuery);
}

function handleSearch(query) {
  const q = query.trim().toLowerCase();
  const container = document.getElementById('results-container');
  if (!q) {
    renderSuggestions(container);
    return;
  }
  const filtered = allResults.filter(r =>
    r.title.toLowerCase().includes(q) ||
    r.snippet.toLowerCase().includes(q) ||
    r.section.toLowerCase().includes(q)
  );
  if (!filtered.length) {
    container.innerHTML = `
      <p class="text-sm text-slate-500 mb-6">No results for "<strong>${query}</strong>"</p>`;
    renderSuggestions(container, true);
    return;
  }
  // Group by section
  const grouped = {};
  filtered.forEach(r => { if (!grouped[r.section]) grouped[r.section] = []; grouped[r.section].push(r); });
  container.innerHTML = `
    <p class="text-sm text-slate-500 mb-6">${filtered.length} result${filtered.length!==1?'s':''} for "<strong class="text-slate-800">${query}</strong>"</p>
    ${Object.entries(grouped).map(([section, results]) => `
      <div class="mb-8">
        <div class="flex items-center gap-2 mb-3">
          <span class="text-xs font-bold uppercase tracking-widest px-2.5 py-1 rounded-full ${sectionColors[section]||'bg-slate-100 text-slate-600'}">${section}</span>
        </div>
        <div class="space-y-3">
          ${results.map(r => `
            <div class="bg-white rounded-xl border border-slate-200 p-5 hover:shadow-sm transition-shadow">
              <div class="flex items-start justify-between gap-4">
                <div class="flex-1 min-w-0">
                  <h3 class="font-bold text-slate-900 mb-1 text-sm">${r.title}</h3>
                  <p class="text-xs text-slate-500 mb-2">${r.metadata}</p>
                  <p class="text-sm text-slate-600 leading-relaxed">${r.snippet}</p>
                </div>
                <a href="${r.url}" class="flex-shrink-0 text-xs font-semibold text-rose-600 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 px-3 py-2 rounded-lg transition-colors whitespace-nowrap">${r.actionLabel}</a>
              </div>
            </div>`).join('')}
        </div>
      </div>`).join('')}`;
}

function renderSuggestions(container, append = false) {
  const html = `
    <div ${append?'class="mt-8"':''}>
      <p class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-4">Quick Links</p>
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
        ${suggestions.map(s => `
          <a href="${s.url.replace('/', '')}.html" class="group flex items-center gap-3 bg-white rounded-xl border border-slate-200 p-4 hover:border-rose-200 hover:shadow-sm transition-all">
            <div class="w-8 h-8 rounded-lg bg-rose-50 group-hover:bg-rose-100 text-rose-600 flex items-center justify-center flex-shrink-0 transition-colors">${App.icon(s.icon)}</div>
            <div><p class="text-sm font-semibold text-slate-800">${s.label}</p><p class="text-xs text-slate-400">${s.description}</p></div>
          </a>`).join('')}
      </div>
    </div>`;
  if (append) container.insertAdjacentHTML('beforeend', html);
  else container.innerHTML = html;
}
</script>
</body>
</html>
