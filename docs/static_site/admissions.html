<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admissions — Hulhudhuffaaru School</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['DM Sans','system-ui','sans-serif'], mono: ['IBM Plex Mono','ui-monospace','monospace'] } } } }</script>
</head>
<body class="font-sans bg-slate-50 text-slate-900">
<nav id="nav"></nav>
<main id="main"><div class="flex items-center justify-center min-h-[60vh]"><div class="w-8 h-8 border-2 border-rose-600 border-t-transparent rounded-full animate-spin"></div></div></main>
<footer id="footer"></footer>
<script src="app.js"></script>
<script>
let step = 1;
const formData = {};

document.addEventListener('DOMContentLoaded', async () => {
  App.init('admissions');
  try {
    const d = await App.fetch('admissions');
    renderPage(d.admissionsInfo, d.sampleApplication);
  } catch(e) { App.showError(); }
});

function renderPage(info, sample) {
  document.getElementById('main').innerHTML = `
    <div class="bg-white border-b border-slate-200 py-10">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <p class="text-xs font-bold uppercase tracking-widest text-rose-600 mb-2">Join Our School</p>
        <h1 class="text-3xl sm:text-4xl font-black text-slate-900 mb-3">Admissions</h1>
        <p class="text-slate-500 max-w-2xl text-sm leading-relaxed">${info.overview}</p>
      </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

        <!-- Left: info panels -->
        <div class="lg:col-span-1 space-y-6">
          <!-- Requirements -->
          <div class="bg-white rounded-2xl border border-slate-200 p-6">
            <p class="text-xs font-bold uppercase tracking-widest text-rose-600 mb-4">Requirements</p>
            <ul class="space-y-3">
              ${info.requirements.map(r=>`
                <li class="flex items-start gap-2.5">
                  <span class="w-4 h-4 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center flex-shrink-0 mt-0.5 text-[10px]">✓</span>
                  <div><p class="text-sm text-slate-700">${r.label}</p>${r.note?`<p class="text-xs text-slate-400 mt-0.5">${r.note}</p>`:''}</div>
                </li>`).join('')}
            </ul>
          </div>

          <!-- Key Dates -->
          <div class="bg-white rounded-2xl border border-slate-200 p-6">
            <p class="text-xs font-bold uppercase tracking-widest text-sky-600 mb-4">Key Dates</p>
            <div class="space-y-3">
              ${info.keyDates.map(kd=>`
                <div class="flex items-start gap-3">
                  <div class="text-center flex-shrink-0 w-12">
                    <p class="text-lg font-black text-rose-600 leading-none">${new Date(kd.date).getDate()}</p>
                    <p class="text-[10px] text-slate-400 uppercase font-semibold">${new Date(kd.date).toLocaleString('en',{month:'short'})}</p>
                  </div>
                  <div><p class="text-sm font-semibold text-slate-800">${kd.label}</p>${kd.note?`<p class="text-xs text-slate-400">${kd.note}</p>`:''}</div>
                </div>`).join('')}
            </div>
          </div>

          <!-- Year Groups -->
          <div class="bg-white rounded-2xl border border-slate-200 p-6">
            <p class="text-xs font-bold uppercase tracking-widest text-slate-500 mb-4">Available Year Groups</p>
            <div class="space-y-2">
              ${info.availableYearGroups.map(yg=>`
                <div class="flex items-center justify-between py-2 border-b border-slate-50 last:border-0">
                  <span class="text-sm text-slate-700">${yg.label}</span>
                  <span class="text-xs font-semibold px-2 py-0.5 rounded-full ${yg.available?'bg-emerald-100 text-emerald-700':'bg-slate-100 text-slate-400'}">${yg.available?'Open':'Full'}</span>
                </div>`).join('')}
            </div>
          </div>
        </div>

        <!-- Right: form + tracker -->
        <div class="lg:col-span-2 space-y-6">
          <!-- Multi-step form -->
          <div class="bg-white rounded-2xl border border-slate-200 p-6 sm:p-8">
            <div class="flex items-center gap-3 mb-8">
              ${[1,2,3].map(s=>`
                <div class="flex items-center gap-2 ${s<3?'flex-1':''}" id="step-indicator-${s}">
                  <div class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0 step-circle-${s} ${s===1?'bg-rose-600 text-white':'bg-slate-100 text-slate-400'}">${s}</div>
                  <span class="text-xs font-semibold hidden sm:block ${s===1?'text-rose-600':'text-slate-400'} step-label-${s}">${['Student Details','Guardian Info','School Background'][s-1]}</span>
                  ${s<3?'<div class="flex-1 h-px bg-slate-200 mx-1"></div>':''}
                </div>`).join('')}
            </div>

            <div id="form-step-1">
              <h3 class="font-bold text-slate-900 mb-5">Student Details</h3>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div><label class="block text-xs font-semibold text-slate-600 mb-1.5">First Name *</label><input type="text" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-rose-500 text-sm"></div>
                <div><label class="block text-xs font-semibold text-slate-600 mb-1.5">Last Name *</label><input type="text" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-rose-500 text-sm"></div>
                <div><label class="block text-xs font-semibold text-slate-600 mb-1.5">Date of Birth *</label><input type="date" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-rose-500 text-sm"></div>
                <div><label class="block text-xs font-semibold text-slate-600 mb-1.5">Gender *</label><select class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-rose-500 text-sm bg-white"><option value="">Select...</option><option>Male</option><option>Female</option></select></div>
                <div class="sm:col-span-2"><label class="block text-xs font-semibold text-slate-600 mb-1.5">Nationality *</label><input type="text" placeholder="e.g. Maldivian" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-rose-500 text-sm"></div>
              </div>
              <button onclick="goStep(2)" class="mt-6 w-full bg-rose-600 hover:bg-rose-700 text-white font-semibold py-3 rounded-xl transition-colors text-sm">Continue</button>
            </div>

            <div id="form-step-2" class="hidden">
              <h3 class="font-bold text-slate-900 mb-5">Guardian Information</h3>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div><label class="block text-xs font-semibold text-slate-600 mb-1.5">First Name *</label><input type="text" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-rose-500 text-sm"></div>
                <div><label class="block text-xs font-semibold text-slate-600 mb-1.5">Last Name *</label><input type="text" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-rose-500 text-sm"></div>
                <div><label class="block text-xs font-semibold text-slate-600 mb-1.5">Relationship *</label><select class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-rose-500 text-sm bg-white"><option value="">Select...</option><option>Father</option><option>Mother</option><option>Guardian</option></select></div>
                <div><label class="block text-xs font-semibold text-slate-600 mb-1.5">Phone *</label><input type="tel" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-rose-500 text-sm"></div>
                <div class="sm:col-span-2"><label class="block text-xs font-semibold text-slate-600 mb-1.5">Email *</label><input type="email" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-rose-500 text-sm"></div>
              </div>
              <div class="flex gap-3 mt-6">
                <button onclick="goStep(1)" class="flex-1 border border-slate-200 hover:bg-slate-50 text-slate-700 font-semibold py-3 rounded-xl transition-colors text-sm">Back</button>
                <button onclick="goStep(3)" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-semibold py-3 rounded-xl transition-colors text-sm">Continue</button>
              </div>
            </div>

            <div id="form-step-3" class="hidden">
              <h3 class="font-bold text-slate-900 mb-5">School Background</h3>
              <div class="space-y-4">
                <div><label class="block text-xs font-semibold text-slate-600 mb-1.5">Applying for Year Group *</label>
                  <select class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-rose-500 text-sm bg-white">
                    ${info.availableYearGroups.filter(y=>y.available).map(y=>`<option>${y.label}</option>`).join('')}
                  </select>
                </div>
                <div><label class="block text-xs font-semibold text-slate-600 mb-1.5">Current School *</label><input type="text" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-rose-500 text-sm"></div>
                <div><label class="block text-xs font-semibold text-slate-600 mb-1.5">Current Year Group *</label><input type="text" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-rose-500 text-sm"></div>
                <div><label class="block text-xs font-semibold text-slate-600 mb-1.5">Reason for Transfer *</label><textarea rows="4" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-rose-500 text-sm resize-none"></textarea></div>
              </div>
              <div class="flex gap-3 mt-6">
                <button onclick="goStep(2)" class="flex-1 border border-slate-200 hover:bg-slate-50 text-slate-700 font-semibold py-3 rounded-xl transition-colors text-sm">Back</button>
                <button onclick="submitForm()" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-semibold py-3 rounded-xl transition-colors text-sm">Submit Application</button>
              </div>
            </div>
          </div>

          <!-- Track application -->
          <div class="bg-slate-900 rounded-2xl p-6 sm:p-8">
            <p class="text-xs font-bold uppercase tracking-widest text-sky-400 mb-2">Already Applied?</p>
            <h3 class="text-lg font-bold text-white mb-4">Track Your Application</h3>
            <div class="flex gap-3">
              <input type="text" id="ref-input" placeholder="e.g. SP-2025-00847" class="flex-1 px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm">
              <button onclick="trackApp('${sample.referenceNumber}')" class="bg-sky-600 hover:bg-sky-700 text-white font-semibold px-5 py-2.5 rounded-xl transition-colors text-sm">Track</button>
            </div>
            <p class="text-xs text-slate-500 mt-2">Try: <code class="text-sky-400">${sample.referenceNumber}</code></p>
            <div id="tracker-result" class="mt-5 hidden"></div>
          </div>
        </div>
      </div>
    </div>`;

  window._sampleApp = sample;
}

function goStep(n) {
  [1,2,3].forEach(s => {
    document.getElementById(`form-step-${s}`).classList.toggle('hidden', s !== n);
    const circle = document.querySelector(`.step-circle-${s}`);
    const label = document.querySelector(`.step-label-${s}`);
    if (s < n) { circle.className = circle.className.replace('bg-slate-100 text-slate-400','bg-emerald-500 text-white'); }
    else if (s === n) { circle.className = circle.className.replace('bg-slate-100 text-slate-400','bg-rose-600 text-white'); label.classList.replace('text-slate-400','text-rose-600'); }
    else { circle.className = 'w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0 bg-slate-100 text-slate-400 step-circle-'+s; label.className = 'text-xs font-semibold hidden sm:block text-slate-400 step-label-'+s; }
  });
}

function submitForm() {
  document.getElementById('form-step-3').innerHTML = `<div class="text-center py-8"><div class="w-12 h-12 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4"><svg class="w-6 h-6 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg></div><h3 class="font-bold text-slate-900 text-lg mb-2">Application Submitted!</h3><p class="text-sm text-slate-500">Your reference number is <strong class="text-rose-600">SP-2025-${Math.floor(Math.random()*90000)+10000}</strong></p></div>`;
}

function trackApp(demoRef) {
  const ref = document.getElementById('ref-input').value || demoRef;
  const app = window._sampleApp;
  if (ref !== app.referenceNumber) {
    document.getElementById('tracker-result').className = 'mt-5';
    document.getElementById('tracker-result').innerHTML = `<p class="text-sm text-red-400">Application not found. Try: ${app.referenceNumber}</p>`;
    return;
  }
  document.getElementById('tracker-result').className = 'mt-5';
  document.getElementById('tracker-result').innerHTML = `
    <div class="bg-slate-800 rounded-xl p-4">
      <div class="flex items-center justify-between mb-3">
        <div><p class="text-white font-bold">${app.applicant.firstName} ${app.applicant.lastName}</p><p class="text-slate-400 text-xs">Ref: ${app.referenceNumber}</p></div>
        <span class="text-xs font-bold uppercase tracking-wide bg-sky-900/50 text-sky-400 px-2.5 py-1 rounded-full">${app.status.replace('_',' ')}</span>
      </div>
      <div class="space-y-2">
        ${app.stages.map(s=>`
          <div class="flex items-start gap-3">
            <div class="w-5 h-5 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5 ${s.status==='completed'?'bg-emerald-500':s.status==='in_progress'?'bg-sky-500 animate-pulse':'bg-slate-700'} text-white text-[10px]">${s.status==='completed'?'✓':s.status==='in_progress'?'…':''}</div>
            <div><p class="text-sm font-semibold text-white">${s.label}</p><p class="text-xs text-slate-400">${s.description}</p>${s.completedAt?`<p class="text-[10px] text-emerald-400 mt-0.5">${App.formatShortDate(s.completedAt)}</p>`:''}</div>
          </div>`).join('')}
      </div>
      ${app.nextSteps?`<p class="mt-4 text-xs text-slate-300 bg-slate-700/50 rounded-lg p-3 leading-relaxed">${app.nextSteps}</p>`:''}
    </div>`;
}
</script>
</body>
</html>
